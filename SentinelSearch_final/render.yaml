# Render blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Or configure manually as a Web Service with the same settings below.
services:
  - type: web
    name: sentinel-search-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # get a free key at https://console.groq.com/keys, set it manually in the Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: VECTOR_DB_PATH
        value: ./data/vector_db
      - key: DOCUMENTS_PATH
        value: ./data/documents
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: ENABLE_MODERATION
        value: "true"
    # NOTE: Render's free-tier disk is ephemeral — the ChromaDB vector store
    # resets on every redeploy/restart. Add a paid persistent disk mounted
    # at /app/data if you need the knowledge base to survive restarts.
